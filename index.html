<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🤖🦛 Inc. Studio</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Hippo Studio">
<meta name="theme-color" content="#5b5bf0"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#f6f7fb;--surface:#ffffff;--surface-2:#f1f3f9;--border:#e3e6ef;--text:#14161f;--muted:#646a7e;--faint:#9aa0b3;
  --accent:#5b5bf0;--accent-2:#7c5cff;--accent-soft:#ececff;--good:#12a36b;--good-soft:#e3f7ee;--warn:#d98a00;--warn-soft:#fff3db;
  --bad:#e0453a;--bad-soft:#fde8e6;--info:#1f8fd6;--info-soft:#e2f2fc;
  --shadow:0 1px 2px rgba(20,22,40,.04),0 4px 16px rgba(20,22,40,.05);--shadow-lg:0 12px 40px rgba(20,22,40,.18);
  --r:14px;--r-sm:9px;--side:236px;
  --ev-film:#7c5cff;--ev-book:#1f8fd6;--ev-plan:#e09a00;--ev-pub:#12a36b;--ev-dep:#d0569f;--ev-final:#0e9aa7;--ev-over:#e0453a;--ev-appt:#64748b;
  font-family:"Inter","Noto Sans KR","Noto Sans SC",system-ui,-apple-system,sans-serif;
}
[data-theme=dark]{
  --bg:#0e1017;--surface:#161923;--surface-2:#1d212e;--border:#2a2f3e;--text:#eceef5;--muted:#9aa1b5;--faint:#646b80;
  --accent:#8b8bff;--accent-2:#a58bff;--accent-soft:#25264a;--good:#3fd197;--good-soft:#123326;--warn:#f2b23c;--warn-soft:#3a2c0f;
  --bad:#ff7066;--bad-soft:#3d1a18;--info:#5bb8f2;--info-soft:#132c3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:var(--side);flex:none;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;transition:width .2s;z-index:30}
.app.collapsed .side{width:68px}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden}
.brand .logo{width:42px;height:36px;border-radius:11px;font-size:14px;letter-spacing:-2px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:17px;flex:none;box-shadow:0 4px 12px rgba(91,91,240,.35)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;overflow:hidden}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;padding:1px 7px;font-weight:600}
.app.collapsed .nav a span,.app.collapsed .brand .bt,.app.collapsed .side-foot .lbl,.app.collapsed .nav .badge{display:none}
.side-foot{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:12px 26px;border-bottom:1px solid var(--border)}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sp{flex:1}
.content{padding:22px 26px 80px;max-width:1440px;width:100%}
.banner{margin:12px 26px 0;padding:10px 14px;border-radius:var(--r-sm);font-size:13px;display:flex;gap:10px;align-items:center}
.banner.bad{background:var(--bad-soft);color:var(--bad)}.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.good{background:var(--good-soft);color:var(--good)}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);padding:7px 13px;border-radius:10px;cursor:pointer;font-weight:550;white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(91,91,240,.3)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad)}.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:7px;width:34px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
/* Cards & grid */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:550;display:flex;gap:6px;align-items:center}
.kpi .val{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.25}
.kpi .val .cur2{display:block;font-size:15px;font-weight:650;color:var(--muted)}
.kpi .sub{font-size:12px;color:var(--faint);margin-top:4px}
.kpi.accent{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none}
.kpi.accent .lbl,.kpi.accent .sub,.kpi.accent .val .cur2{color:rgba(255,255,255,.82)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sec-title{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:24px 0 10px}
/* Pills / chips */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:550;user-select:none}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip:hover:not(.on){border-color:var(--faint)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:8px;cursor:pointer;font-weight:550;color:var(--muted);font-size:13px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
/* Forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-size:12px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%;outline:none;transition:.12s;min-height:37px}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:70px;resize:vertical}
.inp.big{font-size:20px;font-weight:650;padding:10px 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.moneyin{display:flex;gap:6px}.moneyin .inp{flex:1}
.hint{font-size:12px;color:var(--faint)}
.search{position:relative}.search input{padding-left:32px}.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;color:var(--faint)}
/* Table */
.tbl-wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .muted{color:var(--muted)}
.b{font-weight:650}.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}.nowrap{white-space:nowrap}.right{text-align:right}
.prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:99px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.flag{color:var(--warn);font-weight:700}
/* Modal & drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,22,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;animation:pop .18s}
.modal.wide{width:min(880px,100%)}
.modal header{padding:18px 20px 6px;display:flex;align-items:center;gap:10px}.modal header h2{margin:0;font-size:17px;flex:1}
.modal .body{padding:10px 20px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.drawer-scrim{position:fixed;inset:0;background:rgba(10,12,22,.35);z-index:50;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:51;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slide .2s}
.drawer header{padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.drawer header h2{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.drawer footer{padding:12px 20px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.97);opacity:0}}@keyframes slide{from{transform:translateX(40px);opacity:0}}
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-weight:550;animation:pop .2s;display:flex;gap:10px;align-items:center}
.toast.bad{background:var(--bad);color:#fff}
/* Money summary block */
.moneybox{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.moneybox>div{background:var(--surface);padding:10px 12px}
.moneybox .l{font-size:11.5px;color:var(--muted);font-weight:600}.moneybox .v{font-size:16px;font-weight:700;margin-top:2px}
/* Calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h2{margin:0;font-size:18px;min-width:170px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--border);gap:1px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.cal .dow{background:var(--surface-2);padding:8px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.cal .day{background:var(--surface);min-height:112px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day:hover{background:var(--surface-2)}
.cal .day.other{background:var(--bg)}.cal .day.other .dn{color:var(--faint)}
.cal .day.today .dn{background:var(--accent);color:#fff}
.cal .dn{font-size:12px;font-weight:650;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.cal.week .day{min-height:420px}
.ev{font-size:11.5px;padding:2px 6px;border-radius:6px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550;cursor:pointer;line-height:1.5}
.ev.est{background:transparent!important;border:1.5px dashed;color:var(--text)}
.ev:hover{filter:brightness(1.1)}
.cal.week .ev{white-space:normal;padding:5px 7px}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:220px;animation:pop .12s}
.pop button{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;gap:8px;font-weight:550}
.pop button:hover{background:var(--surface-2)}
.pop .ttl{font-size:12px;color:var(--muted);padding:6px 10px 4px;font-weight:600}
/* Charts */
.chart svg{width:100%;height:auto;display:block}
.chart .ax{font-size:10.5px;fill:var(--faint)}
.bars-h .r{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.bars-h .r .n{width:96px;color:var(--muted);flex:none}.bars-h .r .t{flex:1;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bars-h .r .t i{display:block;height:100%;border-radius:99px}.bars-h .r .c{width:30px;text-align:right;font-weight:650}
.list .it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
.list .it:last-child{border:0}
.list .it .dt{width:46px;flex:none;text-align:center;background:var(--surface-2);border-radius:9px;padding:4px 0;font-size:11px;color:var(--muted);font-weight:600;line-height:1.2}
.list .it .dt b{display:block;font-size:16px;color:var(--text)}
.list .it .mn{flex:1;min-width:0}.list .it .mn div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .search{flex:1;min-width:200px;max-width:340px}
.kbd{font-size:11px;border:1px solid var(--border);border-radius:5px;padding:0 5px;color:var(--faint)}
.issue{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--text);font-size:13px;align-items:flex-start}
.issue.bad{background:var(--bad-soft)}.issue.ok{background:var(--good-soft)}
.issue b{flex:none}
.avatar{width:26px;height:26px;border-radius:50%;flex:none}
.stack{display:flex;flex-direction:column;gap:10px}
.landflow{display:flex;align-items:center;gap:6px;font-size:12px}
.landflow .st{padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--faint);font-weight:600}
.landflow .st.on{background:var(--accent-soft);color:var(--accent)}.landflow .st.done{background:var(--good-soft);color:var(--good)}
.fab{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .side{position:fixed;left:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  .app.mobile-open .side{transform:none}
  .app.collapsed .side{width:var(--side)}
  .app.collapsed .nav a span,.app.collapsed .brand .bt,.app.collapsed .side-foot .lbl{display:initial}
  .top{padding:10px 14px}.content{padding:14px 14px 90px}.banner{margin:10px 14px 0}
  .g4,.g3,.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .g2.stackm,.g3.stackm{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .kpi .val{font-size:17px}
  .cal .day{min-height:64px;padding:3px}.cal .ev{font-size:0;height:6px;padding:0;border-radius:3px}
  .cal.week{grid-template-columns:1fr}.cal.week .dow{display:none}.cal.week .day{min-height:auto}.cal.week .ev{font-size:12px;height:auto;padding:4px 7px}
  .fab{display:grid;position:fixed;right:18px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:0;box-shadow:var(--shadow-lg);z-index:40;place-items:center;font-size:26px}
  .hide-m{display:none!important}
  .moneybox{grid-template-columns:1fr 1fr}
}

.kpi .lbl svg{width:15px;height:15px;flex:none}
a svg,.small svg{width:14px;height:14px;vertical-align:-2px}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;background:radial-gradient(circle at 20% 0%,var(--accent-soft),transparent 60%),var(--bg)}
.auth-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px 24px;display:flex;flex-direction:column;gap:12px}
.auth-card h2{margin:4px 0 0;font-size:20px}.auth-card p{margin:0}
.logo-big{width:64px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:22px;letter-spacing:-3px;box-shadow:0 6px 18px rgba(91,91,240,.35)}
@supports(padding:env(safe-area-inset-top)){.top{padding-top:max(12px,env(safe-area-inset-top))}.side{padding-top:env(safe-area-inset-top)}.content{padding-bottom:calc(80px + env(safe-area-inset-bottom))}.fab{bottom:calc(20px + env(safe-area-inset-bottom))}.drawer header{padding-top:max(16px,env(safe-area-inset-top))}.drawer footer{padding-bottom:max(12px,env(safe-area-inset-bottom))}}
</style></head>
<body><div id="app" class="app"></div><div class="toast-wrap" id="toasts"></div>
<script src="supabase.js"></script>
<script>/* ===== CORE: pure business logic (no DOM). Tested in Node. ===== */
const CORE = (() => {
  const STATUSES = ['Inquiry','Negotiating','Confirmed','Filmed','Editing','Published','Completed','Cancelled'];
  const CONFIRMED_SET = new Set(['Confirmed','Filmed','Editing','Published','Completed']);
  const CURS = ['CNY','KRW'];
  const SYM = { CNY: '¥', KRW: '₩' };

  const pad = n => String(n).padStart(2, '0');
  function todayISO(tzOffsetMin = 540) { // default Korea time
    const d = new Date(Date.now() + tzOffsetMin * 60000);
    return d.toISOString().slice(0, 10);
  }
  function addDays(iso, n) {
    if (!iso) return null;
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d + Number(n)));
    return dt.toISOString().slice(0, 10);
  }

function metrics(r) {
  const cs = camps(), ps = pays(), td = today();
  const m = { contracted: C.zero(), contractedN: 0, unknownFeeN: 0, cash: C.zero(), undated: C.zero(), undatedN: 0, deposits: C.zero(), outstanding: C.zero(), overdue: C.zero(), overdueN: 0,
    expenses: C.zero(), net: C.zero(), confirmedN: 0, waiting: C.zero(), waitingN: 0, landedKrw: 0, unconfirmedLand: C.zero() };
  for (const c of cs) {
    if (c.status === 'Cancelled') continue;
    const s = sumOf(c);
    if (C.CONFIRMED_SET.has(c.status) && C.inRange(C.contractDate(c), r)) { m.contractedN++; if (s.fee === null) m.unknownFeeN++; else C.addTo(m.contracted, c.currency, s.fee); }
    if (C.CONFIRMED_SET.has(c.status) && c.status !== 'Completed' && C.inRange(C.contractDate(c), r)) m.confirmedN++;
    if (c.archived) continue;
    if (s.outstanding) C.addTo(m.outstanding, c.currency, s.outstanding);
    s.overdue.forEach(o => C.addTo(m.overdue, c.currency, o.amount)); if (s.overdue.length) m.overdueN++;
  }
  for (const p of ps) {
    const amt = Number(p.amount) || 0;
    if (!p.date && p.archived && UI.period !== 'all') continue;
    if (!p.date) { if (UI.period === 'all') { C.addTo(m.cash, p.currency, amt); if (p.type === 'deposit') C.addTo(m.deposits, p.currency, amt); } C.addTo(m.undated, p.currency, amt); m.undatedN++; }
    else if (C.inRange(p.date, r)) { C.addTo(m.cash, p.currency, amt); if (p.type === 'deposit') C.addTo(m.deposits, p.currency, amt); }
    if (!p.archived && (p.landStatus === 'held' || p.landStatus === 'transit')) { C.addTo(m.waiting, p.currency, amt); m.waitingN++; }
    if (!p.archived && p.landStatus === 'unknown') C.addTo(m.unconfirmedLand, p.currency, amt);
    if (p.landStatus === 'landed' && C.inRange(p.landDate || p.date, r)) m.landedKrw += C.landedKRW(p, S.data.transfers) || 0;
  }
  for (const e of list('expenses')) if (C.expenseInRange(e, r)) C.addTo(m.expenses, e.currency, Number(e.amount) || 0);
  for (const k of C.CURS) m.net[k] = C.round((m.cash[k] || 0) - (m.expenses[k] || 0), k);
  return m;
}

function compact(v, cur) {
  const sym = C.SYM[cur]; if (v === 0) return sym + '0';
  if (LANG === 'ko' && cur === 'KRW' && v >= 10000) return sym + Math.round(v / 10000).toLocaleString() + '만';
  if (v >= 1e6) return sym + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'M';
  if (v >= 1e3) return sym + (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'k';
  return sym + Math.round(v);
}
function monthlyChart() {
  const months = []; const [ay, am] = (UI.period === 'month' ? UI.anchor : C.todayISO().slice(0, 7)).split('-').map(Number);
  for (let i = 5; i >= 0; i--) { const d = new Date(Date.UTC(ay, am - 1 - i, 1)); months.push(d.toISOString().slice(0, 7)); }
  const cur = UI.chartCur;
  const val = (amt, c, conv) => cur === 'CONV' ? conv : (c === cur ? amt : 0);
  let unconv = 0;
  const data = months.map(mo => {
    let inc = 0, exp = 0;
    pays().forEach(p => { if (p.date && p.date.slice(0, 7) === mo) { const k = cur === 'CONV' ? paymentKRW(p).krw : null; if (cur === 'CONV' && k === null) unconv++; inc += val(Number(p.amount), p.currency, k || 0); } });
    list('expenses').forEach(e => { const em = e.reportMonth || (e.date || '').slice(0, 7); if (em === mo) { const k = cur === 'CONV' ? expenseKRW(e).krw : null; if (cur === 'CONV' && k === null) unconv++; exp += val(Number(e.amount), e.currency, k || 0); } });
    return { mo, inc, exp };
  });
  const max = Math.max(1, ...data.flatMap(d => [d.inc, d.exp]));
  const W = 640, H = 220, pl = 54, pb = 26, bw = (W - pl - 10) / months.length;
  const y = v => H - pb - (v / max) * (H - pb - 14);
  const ccy = cur === 'CONV' ? 'KRW' : cur;
  const ticks = [0, .5, 1].map(f => max * f);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('ch_monthly')}">
    ${ticks.map(v => `<line x1="${pl}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text class="ax" x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${compact(v, ccy)}</text>`).join('')}
    ${data.map((d, i) => { const x = pl + i * bw + bw * .18, w = bw * .3; return `<rect x="${x}" y="${y(d.inc)}" width="${w}" height="${H - pb - y(d.inc)}" rx="4" fill="var(--accent)"><title>${t('ch_in')} ${F(d.inc, ccy)}</title></rect><rect x="${x + w + 3}" y="${y(d.exp)}" width="${w}" height="${H - pb - y(d.exp)}" rx="4" fill="var(--warn)" opacity=".85"><title>${t('ch_out')} ${F(d.exp, ccy)}</title></rect><text class="ax" x="${pl + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${fmtMonth(d.mo).replace(/\d{4}년?\s?/, '').slice(0, LANG === 'ko' ? 4 : 3)}</text>`; }).join('')}
  </svg>
  <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>${t('ch_in')}</span><span><i class="dot" style="background:var(--warn)"></i>${t('ch_out')}</span>${cur === 'CONV' ? `<span>${t('ch_conv_note', { n: unconv })}</span>` : ''}<span>${t('ch_undated_note')}</span></div></div>`;
}

/* ---------- Bank landing (CNY → KRW) ---------- */
function landingModal(ids) {
  const ps = ids.map(i => S.data.payments[i]).filter(Boolean);
  const cny = ps.filter(p => p.currency === 'CNY'); const krw = ps.filter(p => p.currency === 'KRW');
  const total = C.round(cny.reduce((s, p) => s + Number(p.amount), 0), 'CNY');
  const ref = C.rateFor(today(), rates());
  const m = modal(`<header><h2>🏦 ${t('land_title')}</h2><button class="btn icon ghost" data-close>${ic('x')}</button></header>
  <div class="body">
    <div class="tbl-wrap"><table class="tbl"><tbody>${ps.map(p => `<tr style="cursor:default"><td>${esc(S.data.campaigns[p.campaignId]?.brand || '?')}</td><td class="small">${p.date ? fmtDate(p.date) : t('date_unknown')}</td><td class="num b">${F(Number(p.amount), p.currency)}</td></tr>`).join('')}</tbody></table></div>
    ${cny.length ? `<div class="fgrid">
      <div class="field"><label>${t('land_cny_total')}</label><div class="inp" style="background:var(--surface-2)">${F(total, 'CNY')}</div></div>
      <div class="field"><label>${t('land_krw')}</label><input class="inp big" id="l-krw" inputmode="decimal" placeholder="${ref ? Math.round(total * ref.rate).toLocaleString() : ''}"></div>
      <div class="field"><label>${t('land_date')}</label><input type="date" class="inp" id="l-date" value="${today()}"></div>
      <div class="field"><label>${t('land_fee')}</label><input class="inp" id="l-fee" inputmode="decimal" placeholder="0"></div>
      <div class="field full"><label>${t('land_method')}</label><input class="inp" id="l-method" list="l-methods" placeholder="${t('land_method_ph')}"><datalist id="l-methods">${['Wise', 'WeChat → Toss', 'Alipay → bank', 'Bank wire (SWIFT)', 'MCN transfer'].map(x => `<option value="${x}">`).join('')}</datalist></div>
    </div><div class="issue ok" id="l-prev">${t('land_enter')}</div>` : ''}
    ${krw.length ? `<div class="field"><label>${t('land_date')} (KRW)</label><input type="date" class="inp" id="l-date2" value="${today()}"><div class="hint">${t('land_krw_hint')}</div></div>` : ''}
    <div class="field"><label>${t('notes')}</label><input class="inp" id="l-note"></div>
  </div>
  <footer><button class="btn" data-close>${t('cancel')}</button><button class="btn good" id="l-save">${t('land_confirm')}</button></footer>`);
  const el = m.el;
  const upd = () => { const k = C.parseAmount($('#l-krw', el)?.value); if (!cny.length) return;
    if (!k) { $('#l-prev', el).innerHTML = t('land_enter'); return; }
    const eff = k / total; let s = t('land_eff', { r: eff.toFixed(2) });
    if (ref) { const exp = total * ref.rate; const diff = Math.round(k - exp); s += ' · ' + t('land_vs', { r: ref.rate, d: (diff >= 0 ? '+' : '') + F(diff, 'KRW') }); }
    $('#l-prev', el).innerHTML = s; };
  el.addEventListener('input', upd);
  $('#l-save', el).onclick = async () => {
    $('#l-save', el).disabled = true;
    try {
      const note = $('#l-note', el).value.trim();
      if (cny.length) {
        const k = C.parseAmount($('#l-krw', el).value); if (!k) { toast(t('land_need_krw'), 'bad'); $('#l-save', el).disabled = false; return; }
        const tid = uid('t'); const date = $('#l-date', el).value || today();
        await put('transfers', tid, { date, cnyTotal: total, krwReceived: k, feeKrw: C.parseAmount($('#l-fee', el).value), method: $('#l-method', el).value.trim(), note, paymentIds: cny.map(p => p.id), effRate: k / total }, { replace: true });
        for (const a of C.allocateTransfer(cny, k)) await put('payments', a.id, { landStatus: 'landed', transferId: tid, landKrw: a.landKrw, landDate: date });
      }
      for (const p of krw) await put('payments', p.id, { landStatus: 'landed', landDate: $('#l-date2', el).value || today(), landKrw: Number(p.amount) });
      UI.landSel.clear(); m.close(); toast(t('toast_landed'));
    } catch { $('#l-save', el).disabled = false; }
  };
}

/* ---------- Calendar ---------- */
const EVT = { film: ['--ev-film', 'ev_film'], book: ['--ev-book', 'ev_book'], plan: ['--ev-plan', 'ev_plan'], pub: ['--ev-pub', 'ev_pub'], dep: ['--ev-dep', 'ev_dep'], final: ['--ev-final', 'ev_final'], over: ['--ev-over', 'ev_over'], appt: ['--ev-appt', 'ev_appt'] };
function calEvents() {
  const ev = []; const td = today();
  for (const c of camps()) {
    if (c.status === 'Cancelled') continue; const s = sumOf(c);
    if (c.filmDate) ev.push({ date: c.filmDate, type: 'film', label: (c.filmTime ? c.filmTime + ' ' : '') + c.brand, id: c.id });
    if (c.bookingDate && C.CONFIRMED_SET.has(c.status)) ev.push({ date: c.bookingDate, type: 'book', label: c.brand, id: c.id });
    if (c.expPubDate && !c.actPubDate) ev.push({ date: c.expPubDate, type: 'plan', label: c.brand, id: c.id });
    if (c.actPubDate) ev.push({ date: c.actPubDate, type: 'pub', label: c.brand, id: c.id });
    const depShort = s.depReq ? s.depReq - s.depReceived : 0;
    if (c.depositDue && depShort > 0) ev.push({ date: c.depositDue, type: c.depositDue < td ? 'over' : 'dep', label: `${c.brand} ${F(depShort, c.currency)}`, id: c.id });
    if (s.due && s.outstanding > 0) ev.push({ date: s.due.date, type: s.due.enforceable && s.due.date < td ? 'over' : 'final', est: !s.due.enforceable, label: `${c.brand} ${F(s.outstanding, c.currency)}`, id: c.id });
  }
  for (const a of list('appts')) ev.push({ date: a.date, type: 'appt', label: (a.time ? a.time + ' ' : '') + a.title, appt: a.id });
  const on = UI.cal.types; return on ? ev.filter(e => on.includes(e.type)) : ev;
}
VIEWS_R.calendar = () => {
  const k = UI.cal; const [y, mo, dd] = k.anchor.split('-').map(Number); const td = today();
  const ev = calEvents(); const byDay = {}; ev.forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
  const order = ['over', 'film', 'dep', 'final', 'plan', 'pub', 'book', 'appt'];
  Object.values(byDay).forEach(a => a.sort((p, q) => order.indexOf(p.type) - order.indexOf(q.type)));
  let days = [], title;
  if (k.mode === 'month') {
    const first = new Date(Date.UTC(y, mo - 1, 1)); const start = C.addDays(first.toISOString().slice(0, 10), -((first.getUTCDay() + 6) % 7));
    for (let i = 0; i < 42; i++) days.push(C.addDays(start, i));
    if (days[35].slice(5, 7) !== C.pad(mo)) days = days.slice(0, 35);
    title = fmtMonth(k.anchor.slice(0, 7));
  } else {
    const dt = new Date(Date.UTC(y, mo - 1, dd)); const start = C.addDays(k.anchor, -((dt.getUTCDay() + 6) % 7));
    for (let i = 0; i < 7; i++) days.push(C.addDays(start, i));
    title = `${fmtDate(days[0], { short: true })} – ${fmtDate(days[6])}`;
  }
  const dows = [1, 2, 3, 4, 5, 6, 0].map(i => new Date(Date.UTC(2024, 0, 7 + i)).toLocaleDateString(LANG === 'ko' ? 'ko-KR' : 'en-US', { weekday: 'short', timeZone: 'UTC' }));
  const maxShow = k.mode === 'month' ? 3 : 99;
  const evHtml = e => `<div class="ev ${e.est ? 'est' : ''}" style="${e.est ? `border-color:var(${EVT[e.type][0]})` : `background:var(${EVT[e.type][0]})`}" data-act="cal-ev" ${e.id ? `data-id="${e.id}"` : ''} ${e.appt ? `data-appt="${e.appt}"` : ''} title="${esc(t(EVT[e.type][1]) + (e.est ? ' (' + t('estimated') + ')' : '') + ': ' + e.label)}">${esc(e.label)}</div>`;
  const types = UI.cal.types || Object.keys(EVT);
  return `<div class="cal-head">
    <button class="btn icon" data-act="cal-step" data-d="-1">${ic('left')}</button><button class="btn sm" data-act="cal-today">${t('today')}</button><button class="btn icon" data-act="cal-step" data-d="1">${ic('right')}</button>
    <h2>${title}</h2><span style="flex:1"></span>
    <div class="seg"><button class="${k.mode === 'month' ? 'on' : ''}" data-act="cal-mode" data-v="month">${t('month')}</button><button class="${k.mode === 'week' ? 'on' : ''}" data-act="cal-mode" data-v="week">${t('week')}</button></div>
  </div>
  <div class="cal ${k.mode}">${dows.map(d => `<div class="dow">${d}</div>`).join('')}
    ${days.map(d => { const es = byDay[d] || []; const other = k.mode === 'month' && d.slice(5, 7) !== C.pad(mo);
      return `<div class="day ${other ? 'other' : ''} ${d === td ? 'today' : ''}" data-act="cal-day" data-date="${d}"><div class="row" style="justify-content:space-between"><span class="dn">${Number(d.slice(8))}</span>${k.mode === 'week' ? `<span class="small muted">${fmtDate(d, { short: true, wd: true })}</span>` : ''}</div>
        ${es.slice(0, maxShow).map(evHtml).join('')}${es.length > maxShow ? `<div class="more">+${es.length - maxShow}</div>` : ''}</div>`; }).join('')}
  </div>
  <div class="legend">${Object.entries(EVT).map(([key, [v, l]]) => `<span style="cursor:pointer;opacity:${types.includes(key) ? 1 : .35}" data-act="cal-type" data-v="${key}"><i class="dot" style="background:var(${v})"></i>${t(l)}</span>`).join('')}<span><i class="dot" style="border:1.5px dashed var(--muted)"></i>${t('ev_est_note')}</span></div>
  <p class="hint">${t('cal_hint')}</p>`;
};
ACT['cal-step'] = el => { const k = UI.cal; const [y, m, d] = k.anchor.split('-').map(Number); k.anchor = k.mode === 'month' ? new Date(Date.UTC(y, m - 1 + Number(el.dataset.d), 1)).toISOString().slice(0, 10) : C.addDays(k.anchor, 7 * el.dataset.d); render(); };

/* ---------- Finance ---------- */
VIEWS_R.finance = () => {
  const r = curRange(); const td = today();
  const signed = C.zero(), recv = C.zero(), dep = C.zero(), recvb = C.zero(), exp = C.zero(); let tax = 0, taxPaid = 0, unknownFee = 0;
  const conv = { signed: 0, recv: 0, dep: 0, recvb: 0, exp: 0 }; const unc = { signed: 0, recv: 0, dep: 0, recvb: 0, exp: 0 }; const used = new Map();
  const note = (k, x) => { if (x.krw === null) unc[k]++; else { conv[k] += x.krw; if (x.how !== 'KRW') used.set(x.how, (used.get(x.how) || 0) + 1); } };
  for (const c of camps()) {
    if (c.status === 'Cancelled' || !C.CONFIRMED_SET.has(c.status)) continue; const s = sumOf(c);
    const ctx = { recordRate: c.fxToKrw, date: C.contractDate(c), rates: rates() };
    if (C.inRange(C.contractDate(c), r)) { if (s.fee === null) unknownFee++; else { C.addTo(signed, c.currency, s.fee); note('signed', C.toKRW(s.fee, c.currency, ctx)); }
      if (c.taxAmountKrw) { tax += Number(c.taxAmountKrw); if (c.taxPaid) taxPaid += Number(c.taxAmountKrw); } }
    if (s.outstanding && !c.archived) { C.addTo(recvb, c.currency, s.outstanding); note('recvb', C.toKRW(s.outstanding, c.currency, { ...ctx, date: td })); }
  }
  for (const p of pays()) { const inR = p.date ? C.inRange(p.date, r) : UI.period === 'all'; if (!inR) continue; C.addTo(recv, p.currency, Number(p.amount)); note('recv', paymentKRW(p)); if (p.type === 'deposit') { C.addTo(dep, p.currency, Number(p.amount)); note('dep', paymentKRW(p)); } }
  for (const e of list('expenses')) if (C.expenseInRange(e, r)) { C.addTo(exp, e.currency, Number(e.amount) || 0); note('exp', expenseKRW(e)); }
  const margin = C.zero(); C.CURS.forEach(k => margin[k] = C.round((recv[k] || 0) - (exp[k] || 0), k)); const marginK = conv.recv - conv.exp - tax;
  const rowsDef = [['signed', t('fin_signed'), signed], ['recv', t('fin_recv'), recv], ['dep', t('fin_dep'), dep], ['recvb', t('fin_recvb'), recvb], ['exp', t('fin_exp'), exp]];
  const cell = (k, tot) => `<td class="num">${F(tot.CNY || 0, 'CNY')}</td><td class="num">${F(tot.KRW || 0, 'KRW')}</td><td class="num b">${F(conv[k], 'KRW')}${unc[k] ? ` <span class="flag" title="${t('n_unconv', { n: unc[k] })}">+${unc[k]}?</span>` : ''}</td>`;
  // Moim / 60-40
  const st = settings(); const mo = UI.finMonth; const mrec = list('months').find(x => x.month === mo);
  const mr = C.periodRange('month', mo + '-01');
  let mIn = 0, mOut = 0, mUnc = 0, mTax = 0;

async function authSubmit() {
  const email = ($('#au-email')?.value || AUTH.email).trim().toLowerCase(); const pw = $('#au-pw')?.value || '';
  AUTH.email = email; AUTH.err = ''; AUTH.msg = ''; AUTH.busy = true; render();

  if (AUTH.mode === 'forgot') { render(); return; }

/* ---------- data adapter: mimics the small doc-store API the app uses ---------- */
var LIVE = {}; // coll -> {map, emit}
function makeDB() {
  const client = sbc();
  const coll = name => ({
    onSnapshot(next, onErr) {
      const st = LIVE[name] = { map: new Map(), emit: null };
      st.emit = () => next({ docs: [...st.map].map(([id, d]) => ({ id, exists: true, data: () => d, metadata: { fromCache: false, hasPendingWrites: false } })), metadata: { fromCache: false, hasPendingWrites: false } });
      st.load = async () => {
        const { data, error } = await client.from(name).select('id,data');
        if (error) { onErr && onErr({ code: 'unavailable', message: error.message }); return; }
        st.map = new Map(data.map(r => [r.id, r.data])); st.emit();
      };
      st.load();
      client.channel('rt-' + name).on('postgres_changes', { event: '*', schema: 'public', table: name }, p => {
        if (p.eventType === 'DELETE') st.map.delete(p.old.id); else st.map.set(p.new.id, p.new.data);
        st.emit();
      }).subscribe(s => { if (s === 'SUBSCRIBED') st.load(); });
      return () => {};
    },
    doc(id) {
      return {
        async set(body) { const { error } = await client.from(name).upsert({ id, data: body }); if (error) throw { code: 'unavailable', message: error.message }; const st = LIVE[name]; if (st) { st.map.set(id, body); st.emit(); } },
        async update(body) {
          const { error } = await client.rpc('merge_doc', { t: name, doc_id: id, patch: body });
          if (error) throw { code: /not_found/.test(error.message) ? 'invalid_argument' : 'unavailable', message: error.message };
          const st = LIVE[name]; if (st) { st.map.set(id, { ...(st.map.get(id) || {}), ...body }); st.emit(); }
        },
        async delete() { const { error } = await client.from(name).delete().eq('id', id); if (error) throw { code: 'unavailable', message: error.message }; const st = LIVE[name]; if (st) { st.map.delete(id); st.emit(); } }
      };
    }
  });
  return { collection: coll, doc: p => coll(p.split('/')[0]).doc(p.split('/')[1]) };
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && AUTH.state === 'ok') Object.values(LIVE).forEach(s => s.load && s.load()); });

/* ---------- boot ---------- */
async function initStore() {
  const a = sbc().auth;
  a.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { AUTH.state = 'recovery'; render(); }
    if (ev === 'SIGNED_OUT') { AUTH.state = 'signedOut'; render(); }
  });
  const { data } = await a.getSession();
  if (!data.session) { AUTH.state = AUTH.state === 'recovery' ? 'recovery' : 'signedOut'; render(); return; }
  if (AUTH.state !== 'recovery') afterLogin();
}
var STARTED = false;
async function afterLogin() {
  const { data: { user } } = await sbc().auth.getUser();
  if (!user) { AUTH.state = 'signedOut'; render(); return; }
  AUTH.email = user.email;
  const { data: rows, error } = await sbc().from('allowed_emails').select('email');
  if (error || !rows || !rows.length) { AUTH.state = 'notMember'; render(); return; }
  MEMBERS = rows.map(r => r.email);
  AUTH.state = 'ok';
  S.me = { id: user.id, name: user.email.split('@')[0], email: user.email, isOwner: true, canEdit: true };
  S.canWrite = true;
  if (STARTED) { render(); return; }
  STARTED = true; S.mode = 'connecting'; render();
  DB = makeDB();
  const timer = setTimeout(() => { if (S.mode === 'connecting') { S.mode = 'timeout'; render(); } }, 10000);
  let n = 0; const total = COLLS.length + 1; const done = () => { if (++n === total) { clearTimeout(timer); S.mode = 'cloud'; schedule(); } };
  COLLS.forEach(c => { let first = true; DB.collection(c).onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { o[d.id] = { ...d.data(), id: d.id }; }); S.data[c] = o; if (first) { first = false; S.loaded.add(c); done(); } onRemoteChange(c); schedule();
  }, () => { S.stale = true; schedule(); }); });
  let cf = true;
  DB.collection('config').onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); }); S.config = o; if (cf) { cf = false; done(); } schedule(); }, () => {});
}

/* ---------- files: real downloads in a normal browser ---------- */
async function offerFile(name, text) {
  try {
    const blob = new Blob([text], { type: name.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/json' });
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad/.test(navigator.userAgent)) { await navigator.share({ files: [file] }); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast(t('toast_dl'));
  } catch (e) { if (e && e.name !== 'AbortError') toast(t('toast_savefail'), 'bad'); }
}

/* ---------- start ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render(); initStore();
